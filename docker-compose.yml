version: '3.8'

services:

  app:
    build: .
    container_name: inertia_app
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: inertia_mysql
    restart: always
    environment:
      MYSQL_DATABASE: inertia
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: inertia
      MYSQL_PASSWORD: inertia
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 30s
      retries: 3